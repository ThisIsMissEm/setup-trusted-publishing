version: 2
updates:
  # Keep SHA-pinned GitHub Actions current.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        update-types:
          - minor
          - patch

  # npm dependencies (Dependabot supports pnpm projects via the
  # packageManager field + pnpm-lock.yaml).
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    groups:
      dev-minor-and-patch:
        dependency-type: development
        update-types:
          - minor
          - patch
      prod-minor-and-patch:
        dependency-type: production
        update-types:
          - minor
          - patch
