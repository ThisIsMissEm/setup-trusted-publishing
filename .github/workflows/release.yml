name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    environment: production
    if: ${{ github.ref == 'refs/heads/main' && github.repository_owner == 'ThisIsMissEm' }}
    permissions:
      id-token: write
      pull-requests: write
      contents: write
    steps:
      - name: Checkout Repo
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup pnpm
        uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: '.node-version'
          cache: pnpm

      # Found this via https://github.com/tinacms/tinacms/pull/6249/files
      - name: Upgrade npm for OIDC support
        run: npm install -g npm@latest

      - name: Install Dependencies
        run: pnpm install

      # Custom-publishing pattern: changesets/action handles
      # versioning + release-PR creation; we run `npm stage publish`
      # ourselves as a top-level step gated on `hasChangesets == 'false'`
      # (i.e., the release PR was just merged, no pending changesets
      # remain). See https://github.com/changesets/action#custom-publishing
      - name: Create Release Pull Request
        id: changesets
        uses: changesets/action@63a615b9cd06ba9a3e6d13796c7fbcb080a60a0b # v1.8.0
        with:
          title: Prepare release
          commit: prepare release of packages
          version: pnpm run version-packages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Stage Publish to npm
        if: steps.changesets.outputs.hasChangesets == 'false'
        # OIDC trusted publishing — no NPM_TOKEN needed. The staged
        # tarball is not installable until a human approves it via
        # `npm stage approve <id>` (CLI, with 2FA) or the Staged
        # Packages tab on npmjs.com.
        run: pnpm run release

      - name: Create GitHub Release
        if: steps.changesets.outputs.hasChangesets == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # changesets/action used to do this for us via
        # `createGithubReleases: true`, but that only fires when its
        # own `publish:` input is used. With the custom-publishing
        # pattern we do it ourselves: extract the topmost section
        # from CHANGELOG.md (the one changeset version just wrote)
        # and ship it as the release body.
        run: |
          VERSION=$(jq -r .version package.json)
          NOTES=$(awk '/^## /{if(p)exit; p=1; next} p' CHANGELOG.md)
          gh release create "v$VERSION" \
            --title "v$VERSION" \
            --notes "$NOTES"
